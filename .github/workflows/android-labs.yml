name: Labs 2 and 3 Android APKs

on:
  push:
    branches: [ "Labs" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Lab 2 APK
        run: >
          dotnet publish Lab2/App/Lab2.csproj
          -c Release
          -f net10.0-android
          -p:AndroidKeyStore=false
          -o "${{ github.workspace }}/lab2-apk"

      - name: Build Lab 3 APK
        run: >
          dotnet publish Lab3/App/Lab3.csproj
          -c Release
          -f net10.0-android
          -p:AndroidKeyStore=false
          -o "${{ github.workspace }}/lab3-apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Labs-2-3-android-apks
          path: |
            lab2-apk/**/*.apk
            lab3-apk/**/*.apk
          if-no-files-found: error
