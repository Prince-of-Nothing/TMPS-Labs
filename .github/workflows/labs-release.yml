name: Labs 2 and 3 release

on:
  push:
    tags:
      - 'labs-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labs-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Test both labs
        run: dotnet test Tests/Watchlist.Tests/Watchlist.Tests.csproj --verbosity normal

      - name: Create a signing keystore for both Android apps
        shell: pwsh
        run: >
          keytool -genkeypair -v
          -keystore release.keystore
          -alias watchlist
          -keyalg RSA
          -keysize 2048
          -validity 10000
          -storepass watchlist
          -keypass watchlist
          -dname "CN=TMPS Watchlist, OU=FAF241, O=TMPS, L=Chisinau, C=MD"

      - name: Publish signed Lab 2 APK
        run: >
          dotnet publish Lab2/App/Lab2.csproj
          -c Release
          -f net10.0-android
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ github.workspace }}/release.keystore"
          -p:AndroidSigningKeyAlias=watchlist
          -p:AndroidSigningStorePass=watchlist
          -p:AndroidSigningKeyPass=watchlist
          -o lab2-apk

      - name: Publish signed Lab 3 APK
        run: >
          dotnet publish Lab3/App/Lab3.csproj
          -c Release
          -f net10.0-android
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ github.workspace }}/release.keystore"
          -p:AndroidSigningKeyAlias=watchlist
          -p:AndroidSigningStorePass=watchlist
          -p:AndroidSigningKeyPass=watchlist
          -o lab3-apk

      - name: Keep release artifacts available for manual runs
        uses: actions/upload-artifact@v4
        with:
          name: labs-2-3-artifacts
          path: |
            lab2-apk/**/*-Signed.apk
            lab3-apk/**/*-Signed.apk
            Reports/Lab2.md
            Reports/Lab3.md
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Labs 2 and 3 - ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            lab2-apk/**/*-Signed.apk
            lab3-apk/**/*-Signed.apk
            Reports/Lab2.md
            Reports/Lab3.md
