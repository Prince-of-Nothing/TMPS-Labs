name: Lab 2 and tests

on:
  push:
    branches: [ "Labs" ]
  pull_request:
    branches: [ "Labs" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Lab 2 console
        run: dotnet build Lab2/Console/Lab2.csproj

      - name: Test both labs
        run: dotnet test Tests/Watchlist.Tests/Watchlist.Tests.csproj --verbosity normal
