name: Build all labs

# Builds every lab on every push and pull request, so each branch and tag
# is checked. Tags starting with v or labs- also publish a GitHub Release
# with every APK attached.

on:
  push:
    branches: [ "**" ]
    tags: [ "v*", "labs-v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-all-labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-and-tests:
    name: Lab 0 build and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Lab 0 console app
        run: dotnet build Lab0/Lab0.csproj -c Release

      - name: Test Labs 2 and 3 core
        if: hashFiles('Tests/Watchlist.Tests/Watchlist.Tests.csproj') != ''
        run: dotnet test Tests/Watchlist.Tests/Watchlist.Tests.csproj --verbosity normal

  android-apks:
    name: Android APK for Lab ${{ matrix.lab }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lab: 1
            project: Lab1/Lab1.csproj
          - lab: 2
            project: Lab2/App/Lab2.csproj
          - lab: 3
            project: Lab3/App/Lab3.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Publish Lab ${{ matrix.lab }} APK
        run: >
          dotnet publish "${{ matrix.project }}"
          -c Release
          -f net10.0-android
          -p:AndroidKeyStore=false
          -o "${{ github.workspace }}/apk-lab${{ matrix.lab }}"

      - name: Upload Lab ${{ matrix.lab }} APK
        uses: actions/upload-artifact@v4
        with:
          name: lab${{ matrix.lab }}-apk-${{ github.sha }}
          path: apk-lab${{ matrix.lab }}/**/*.apk
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release with every APK
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/labs-v')
    needs: [ console-and-tests, android-apks ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: lab*-apk-${{ github.sha }}
          path: apks
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/**/*-Signed.apk
            Reports/Lab2.md
            Reports/Lab3.md
          generate_release_notes: true
