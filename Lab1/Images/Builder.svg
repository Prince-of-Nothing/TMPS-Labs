<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 z" fill="#fff" stroke="#333" stroke-width="1.4" />
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#333" stroke-width="1.6" />
    </marker>
    <style>
      .cls { fill:#fff; stroke:#333; stroke-width:1.6; }
      .hdr { font-size:19px; font-weight:700; fill:#222; }
      .stereo { font-size:13px; font-style:italic; fill:#444; }
      .op { font-size:14px; fill:#222; }
      .attr { font-size:14px; fill:#222; }
      .under { text-decoration:underline; }
      .client { fill:#f4f4f4; stroke:#333; stroke-width:1.6; }
      .note { fill:#fbfbdc; stroke:#b7b79a; stroke-width:1.2; }
      .noteFold { fill:#e6e6c8; stroke:#b7b79a; stroke-width:1.2; }
      .code { font-family:Consolas, monospace; font-size:13px; fill:#333; }
      .rel { stroke:#333; stroke-width:1.6; fill:none; }
      .dep { stroke:#333; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    </style>
  </defs>

  <!-- code note top -->
  <rect x="330" y="20" width="300" height="96" class="note" />
  <path d="M610,20 L630,20 L630,40 L610,40 z" class="noteFold" />
  <text x="346" y="44" class="code">b = new MediaItemBuilder()</text>
  <text x="346" y="66" class="code">b.WithTitle(..).WithCategory(..)</text>
  <text x="346" y="88" class="code">MediaItem item = b.Build(id)</text>
  <line x1="470" y1="116" x2="470" y2="150" class="dep" />

  <!-- Client -->
  <rect x="405" y="150" width="130" height="52" rx="3" class="client" />
  <text x="470" y="182" text-anchor="middle" class="hdr">Client</text>

  <!-- Builder interface -->
  <g>
    <rect x="120" y="250" width="260" height="150" class="cls" />
    <line x1="120" y1="292" x2="380" y2="292" class="rel" />
    <text x="250" y="272" text-anchor="middle" class="stereo">&#171;interface&#187;</text>
    <text x="250" y="288" text-anchor="middle" class="hdr" font-size="17">MediaItemBuilder</text>
    <text x="132" y="318" class="op under">+ WithTitle(title)</text>
    <text x="132" y="340" class="op under">+ WithCategory(cat)</text>
    <text x="132" y="362" class="op under">+ WithTags(tags)</text>
    <text x="132" y="384" class="op under">+ Build(id): MediaItem</text>
  </g>

  <!-- Concrete builder -->
  <g>
    <rect x="120" y="470" width="260" height="150" class="cls" />
    <line x1="120" y1="512" x2="380" y2="512" class="rel" />
    <text x="250" y="500" text-anchor="middle" class="hdr" font-size="17">MediaItemBuilder</text>
    <text x="132" y="538" class="attr">- title: string</text>
    <text x="132" y="560" class="attr">- category: MediaLabel</text>
    <text x="132" y="582" class="attr">- tags: List&lt;MediaLabel&gt;</text>
    <text x="132" y="604" class="op">+ Build(id): MediaItem</text>
  </g>

  <!-- realization: concrete -> interface -->
  <path d="M250,470 L250,400" class="rel" marker-end="url(#triangle)" />

  <!-- Product -->
  <g>
    <rect x="120" y="660" width="200" height="52" rx="3" class="client" />
    <text x="220" y="692" text-anchor="middle" class="hdr" font-size="17">MediaItem</text>
  </g>
  <path d="M220,620 L220,658" class="rel" marker-end="url(#arrow)" />

  <!-- Client -> interface dependency -->
  <path d="M405,175 L380,300" class="dep" marker-end="url(#arrow)" />

  <!-- note right: Build() -->
  <rect x="620" y="470" width="250" height="120" class="note" />
  <path d="M850,470 L870,470 L870,490 L850,490 z" class="noteFold" />
  <text x="636" y="500" class="code">if (title == null)</text>
  <text x="636" y="522" class="code">  throw ..</text>
  <text x="636" y="548" class="code">return new MediaItem(</text>
  <text x="636" y="570" class="code">  id, title, category)</text>
  <line x1="380" y1="600" x2="618" y2="530" class="dep" />
</svg>
