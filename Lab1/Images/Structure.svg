<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 z" fill="#fff" stroke="#333" stroke-width="1.4" />
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#333" stroke-width="1.6" />
    </marker>
    <style>
      .cls { fill:#fff; stroke:#333; stroke-width:1.6; }
      .iface { fill:#eef4ff; stroke:#3b6fb6; stroke-width:1.6; }
      .hdr { font-size:16px; font-weight:700; fill:#222; }
      .stereo { font-size:12px; font-style:italic; fill:#444; }
      .op { font-size:13px; fill:#222; }
      .client { fill:#f4f4f4; stroke:#333; stroke-width:1.6; }
      .rel { stroke:#333; stroke-width:1.5; fill:none; }
      .dep { stroke:#333; stroke-width:1.3; fill:none; stroke-dasharray:6 4; }
      .grp { fill:#f7f9fc; stroke:#c9d4e5; stroke-width:1.2; }
      .grpt { font-size:14px; font-weight:700; fill:#3b6fb6; }
    </style>
  </defs>

  <!-- client module -->
  <rect x="20" y="30" width="780" height="120" rx="10" class="grp" />
  <text x="410" y="52" text-anchor="middle" class="grpt">Client module</text>
  <rect x="60" y="70" width="140" height="60" rx="3" class="client" />
  <text x="130" y="105" text-anchor="middle" class="hdr">MainPage</text>
  <rect x="260" y="70" width="150" height="60" rx="3" class="client" />
  <text x="335" y="105" text-anchor="middle" class="hdr">MauiProgram</text>

  <!-- factory module -->
  <rect x="20" y="180" width="780" height="130" rx="10" class="grp" />
  <text x="410" y="202" text-anchor="middle" class="grpt">Factory module (creational patterns)</text>

  <rect x="60" y="220" width="200" height="70" rx="3" class="cls" />
  <text x="160" y="245" text-anchor="middle" class="hdr">MediaLibraryStore</text>
  <text x="160" y="268" text-anchor="middle" class="op" font-style="italic">Singleton</text>

  <rect x="300" y="220" width="210" height="70" rx="3" class="cls" />
  <text x="405" y="245" text-anchor="middle" class="hdr">MediaItemBuilder</text>
  <text x="405" y="268" text-anchor="middle" class="op" font-style="italic">Builder</text>

  <rect x="550" y="220" width="210" height="70" rx="3" class="cls" />
  <text x="655" y="245" text-anchor="middle" class="hdr">MediaLibraryFactory</text>
  <text x="655" y="268" text-anchor="middle" class="op" font-style="italic">Factory Method</text>

  <!-- domain module -->
  <rect x="20" y="340" width="780" height="160" rx="10" class="grp" />
  <text x="410" y="362" text-anchor="middle" class="grpt">Domain module</text>

  <rect x="60" y="390" width="180" height="60" rx="3" class="iface" />
  <text x="150" y="415" text-anchor="middle" class="hdr">IMediaLibrary</text>
  <text x="150" y="437" text-anchor="middle" class="stereo">&#171;interface&#187;</text>

  <rect x="290" y="390" width="180" height="60" rx="3" class="cls" />
  <text x="380" y="425" text-anchor="middle" class="hdr">WatchlistService</text>

  <rect x="520" y="390" width="180" height="60" rx="3" class="cls" />
  <text x="610" y="415" text-anchor="middle" class="hdr">MediaItem</text>
  <text x="610" y="437" text-anchor="middle" class="stereo">model</text>

  <!-- arrows -->
  <path d="M200,100 L300,100" class="dep" marker-end="url(#arrow)" />
  <path d="M130,130 L130,220" class="rel" marker-end="url(#arrow)" />
  <path d="M335,130 L335,220" class="rel" marker-end="url(#arrow)" />
  <path d="M655,290 L655,340 L620,340 L620,390" class="rel" marker-end="url(#arrow)" />
  <path d="M160,290 L160,390" class="rel" marker-end="url(#arrow)" />
  <path d="M405,290 L405,340 L380,340 L380,390" class="rel" marker-end="url(#arrow)" />
</svg>
